<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LightFrame - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.2);
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #1e40af;
            font-weight: bold;
        }
        
        .logo-text {
            font-size: 20px;
            font-weight: 600;
        }
        
        .main-content {
            display: flex;
            height: calc(100vh - 60px);
        }
        
        .sidebar {
            width: 200px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px 0;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-right: 3px solid #ffffff;
        }
        
        .content-area {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .welcome-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
        }
        
        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(45deg, #ffffff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .welcome-subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .features-list {
            text-align: left;
            margin-bottom: 40px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 16px;
        }
        
        .feature-icon {
            width: 20px;
            height: 20px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }
        
        .start-button {
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }
        
        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.4);
            background: linear-gradient(45deg, #059669, #047857);
        }
        
        .start-button:active {
            transform: translateY(0);
        }
        
        .version-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">L</div>
            <div class="logo-text">LightFrame</div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="sidebar">
            <div class="sidebar-item active">
                <span>🏠</span> Home
            </div>
            <div class="sidebar-item">
                <span>⚙️</span> Settings
            </div>
            <div class="sidebar-item">
                <span>📊</span> Status
            </div>
            <div class="sidebar-item">
                <span>❓</span> Help
            </div>
        </div>
        
        <div class="content-area">
            <div class="welcome-card">
                <h1 class="welcome-title">Welcome to LightFrame</h1>
                <p class="welcome-subtitle">
                    A transparent desktop overlay that stays on top while remaining invisible to screenshots and screen sharing.
                </p>
                
                <div class="features-list">
                    <div class="feature-item">
                        <div class="feature-icon">✓</div>
                        <span>Always on top overlay</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">✓</div>
                        <span>Click-through transparency</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">✓</div>
                        <span>Screenshot protection</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">✓</div>
                        <span>Hidden from taskbar</span>
                    </div>
                </div>
                
                <button class="start-button" onclick="startLightFrame()">
                    <span class="status-indicator"></span>
                    Start LightFrame
                </button>
            </div>
        </div>
    </div>
    
    <div class="version-info">
        LightFrame v1.0.0
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        function startLightFrame() {
            // Send message to main process to switch to overlay mode
            ipcRenderer.send('start-overlay-mode');
        }
        
        // Add some interactive effects
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
